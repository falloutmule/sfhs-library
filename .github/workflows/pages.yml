name: Verify and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh public itch catalog]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:check
      - run: npm test
      - run: npm run test:browser
      - run: |
          mkdir _site
          cp index.html sw.js manifest.webmanifest icon.svg catalog.json build-info.json _site/
          node -e "require('fs').writeFileSync('_site/release.json',JSON.stringify({...JSON.parse(require('fs').readFileSync('build-info.json')),commit:require('child_process').execSync('git rev-parse HEAD',{encoding:'utf8'}).trim(),repository:process.env.GITHUB_REPOSITORY}))"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
