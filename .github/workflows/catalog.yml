name: Refresh public itch catalog
on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node tools/update-catalog.mjs
      - run: node --test tests/discovery.test.mjs
      - run: npm run build
      - run: npm run build:check
      - name: Commit refreshed public metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/catalog.json catalog.json index.html sw.js build-info.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public itch.io discovery catalog'
            git push
          fi
